<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التأشيرات والعملاء</title>
    <!-- استيراد خط أنيق وعصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #02A5A4;
            --primary-dark: #0D9494;
            --accent: #B05C2E;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* رأس الصفحة العصري */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 25px 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(2, 165, 164, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease-out;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* تخطيط الصفحة */
        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* بطاقات النماذج والعرض */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            animation: fadeInUp 0.6s ease-out;
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: var(--primary);
        }

        /* تنسيق النموذج (Form) وحقول الإدخال */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            background-color: #FAFAFA;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(2, 165, 164, 0.1);
        }

        /* أزرار تفاعلية مع أنيميشن */
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(2, 165, 164, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(2, 165, 164, 0.35);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* جدول البيانات العصري */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background-color: #F1F5F9;
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: var(--text-main);
        }

        tr {
            transition: var(--transition);
        }

        tr:hover {
            background-color: #F8FAFC;
        }

        /* حركات الانيميشن */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <header>
            <h1><i class="fa-solid fa-passport"></i> نظام إدارة التأشيرات</h1>
            <div style="font-size: 0.95rem; font-weight: 600; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px;">
                الوصال للسفريات والسياحة
            </div>
        </header>

        <div class="main-grid">
            <!-- نموذج الإدخال -->
            <div class="card">
                <h2><i class="fa-solid fa-user-plus"></i> إضافة سجل جديد</h2>
                <!-- تم الحفاظ على معرّفات الحقول والدوال القديمة لتتطابق تماماً مع الكود البرمجي لديك -->
                <form id="visaForm" onsubmit="addVisa(event)">
                    <div class="form-group">
                        <label for="clientName">اسم العميل:</label>
                        <input type="text" id="clientName" required placeholder="أدخل اسم العميل ثلاثي">
                    </div>
                    
                    <div class="form-group">
                        <label for="visaType">نوع التأشيرة:</label>
                        <input type="text" id="visaType" required placeholder="مثال: سياحية، عمل...">
                    </div>

                    <div class="form-group">
                        <label for="duration">مدة التأشيرة / التفاصيل:</label>
                        <input type="text" id="duration" required placeholder="مثال: 3 أشهر">
                    </div>

                    <button type="submit" class="btn">
                        <i class="fa-solid fa-floppy-disk"></i> حفظ البيانات
                    </button>
                </form>
            </div>

            <!-- جدول العرض -->
            <div class="card">
                <h2><i class="fa-solid fa-table-list"></i> سجل التأشيرات المحفوظة</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم العميل</th>
                                <th>نوع التأشيرة</th>
                                <th>مدة التأشيرة</th>
                                <th>تاريخ الإضافة</th>
                            </tr>
                        </thead>
                        <!-- تم الحفاظ على id العرض القديم ليعمل الـ JS الخاص بك بكفاءة -->
                        <tbody id="visaTableBody">
                            <!-- سيتم تعبئة البيانات هنا ديناميكياً بواسطة دالتك القديمة renderTable أو fetchVisas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- دوال الجافاسكريبت والربط الأساسية الخاصة بك (نفس المنطق تماماً بدون حذف أي شيء) -->
    <script>
        // ضع هنا نفس أكواد الـ JavaScript القديمة الخاصة بك (مثل fetchVisas و addVisa و renderTable)
        // لتتأكد من أن الاتصال بالسيرفر والـ API يعمل بنفس الطريقة تماماً.
    </script>
</body>
</html>
