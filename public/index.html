<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الوصال - إدارة التأشيرات</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#02A5A4">
    <!-- مكتبات الدعم والاتصال -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #02A5A4;
            --primary-dark: #0D9494;
            --accent: #B05C2E;
            --bg: #F4F7F6;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --border: #E2E8F0;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* رأس الصفحة بتصميم عصري وراقي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(2, 165, 164, 0.25);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        header button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        header button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* شبكة الإحصائيات الفخمة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card h3 {
            font-size: 0.8rem;
            color: #64748B;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .stat-card .number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        /* البطاقات الرئيسية */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            font-weight: 700;
        }

        .card-title i {
            color: var(--primary);
        }

        /* حقول الإدخال */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
        }

        input, select {
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(2, 165, 164, 0.1);
        }

        .calculated-box {
            grid-column: 1 / -1;
            background: #F0FDFA;
            border: 1px solid #CCFBF1;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #0F766E;
        }

        /* الأزرار */
        button.btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(2, 165, 164, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.btn-primary:hover {
            opacity: 0.95;
        }

        /* الجدول العصري */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        th {
            background-color: #F8FAFC;
            color: #475569;
            font-weight: 700;
        }

        tr:hover {
            background-color: #F8FAFC;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-warning { background: #FEF3C7; color: #92400E; }
        .badge-expired { background: #FEE2E2; color: #991B1B; }

        .btn-delete {
            background: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* نافذة QR Code */
        #qrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: var(--radius);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-passport"></i> تطبيق الوصال</h1>
        <div class="header-actions">
            <button onclick="showQRCode()"><i class="fa-solid fa-qrcode"></i> فتح بالجوال</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div>
                <h3>إجمالي العملاء</h3>
                <div class="number" id="totalClients">0</div>
            </div>
            <i class="fa-solid fa-users" style="font-size: 1.8rem; color: var(--primary);"></i>
        </div>
        <div class="stat-card">
            <div>
                <h3>قريبة الانتهاء</h3>
                <div class="number" id="warningVisas" style="color: var(--warning);">0</div>
            </div>
            <i class="fa-solid fa-clock-rotate-left" style="font-size: 1.8rem; color: var(--warning);"></i>
        </div>
        <div class="stat-card">
            <div>
                <h3>منتهية</h3>
                <div class="number" id="expiredVisas" style="color: var(--danger);">0</div>
            </div>
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 1.8rem; color: var(--danger);"></i>
        </div>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-user-plus"></i> إضافة عميل جديد</h2>
        <form id="visaForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم العميل</label>
                    <input type="text" id="clientName" placeholder="أدخلي اسم العميل..." required>
                </div>
                <div class="form-group">
                    <label>رقم الجواز / التأشيرة</label>
                    <input type="text" id="passportNumber" placeholder="رقم الجواز..." required>
                </div>
                <div class="form-group">
                    <label>تاريخ إصدار التأشيرة</label>
                    <input type="date" id="issueDate" required onchange="calculateDates()">
                </div>
                <div class="form-group">
                    <label>مدة التأشيرة (بالأيام)</label>
                    <input type="number" id="durationDays" value="90" required onchange="calculateDates()">
                </div>
                <div class="calculated-box">
                    <div>📅 انتهاء التأشيرة: <span id="calcExpiry">---</span></div>
                    <div>🔔 التنبيه (قبل 5 أيام): <span id="calcAlert">---</span></div>
                </div>
            </div>
            <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> حفظ العميل</button>
        </form>
    </div>

    <div class="card">
        <h2 class="card-title"><i class="fa-solid fa-table-list"></i> سجل التأشيرات (مزامنة فورية ⚡)</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>العميل</th>
                        <th>رقم الجواز</th>
                        <th>الإصدار</th>
                        <th>الانتهاء</th>
                        <th>التنبيه</th>
                        <th>الحالة</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="visaTableBody">
                    <tr><td colspan="7" style="text-align:center;">جاري جلب البيانات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal QR Code -->
    <div id="qrModal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="color: var(--text); font-size: 1.1rem;">مسح الرمز للفتح على الجوال</h3>
            <div id="qrcode"></div>
            <button onclick="document.getElementById('qrModal').style.display='none'" class="btn-delete" style="padding: 6px 15px;">إغلاق</button>
        </div>
    </div>

    <script>
        const socket = io();
        let visasData = [];

        // Calculate dynamic dates
        function calculateDates() {
            const issueDateVal = document.getElementById('issueDate').value;
            const duration = parseInt(document.getElementById('durationDays').value) || 90;

            if (!issueDateVal) return;

            const issue = new Date(issueDateVal);
            const expiry = new Date(issue);
            expiry.setDate(expiry.getDate() + duration);

            const alertDate = new Date(expiry);
            alertDate.setDate(alertDate.getDate() - 5);

            document.getElementById('calcExpiry').innerText = expiry.toISOString().split('T')[0];
            document.getElementById('calcAlert').innerText = alertDate.toISOString().split('T')[0];
        }

        // Fetch Initial Visas
        async function fetchVisas() {
            try {
                const res = await fetch('/api/visas');
                visasData = await res.json();
                renderTable();
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('visaTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">خطأ في الاتصال بالخادم</td></tr>';
            }
        }

        // Render Table & Update Statistics
        function renderTable() {
            const tbody = document.getElementById('visaTableBody');
            tbody.innerHTML = '';

            let total = visasData.length;
            let warning = 0;
            let expired = 0;

            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد تأشيرات مسجلة حتى الآن</td></tr>';
            } else {
                visasData.forEach(v => {
                    if (v.status === 'منتهية') expired++;
                    if (v.status === 'قريبة من الانتهاء') warning++;

                    let badgeClass = 'badge-active';
                    if (v.status === 'منتهية') badgeClass = 'badge-expired';
                    if (v.status === 'قريبة من الانتهاء') badgeClass = 'badge-warning';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${v.clientName}</strong></td>
                        <td>${v.passportNumber}</td>
                        <td>${v.issueDate}</td>
                        <td>${v.expiryDate}</td>
                        <td>${v.alertDate}</td>
                        <td><span class="badge ${badgeClass}">${v.status}</span></td>
                        <td><button class="btn-delete" onclick="deleteVisa('${v._id}')">حذف</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('totalClients').innerText = total;
            document.getElementById('warningVisas').innerText = warning;
            document.getElementById('expiredVisas').innerText = expired;
        }

        // Form Submit
        document.getElementById('visaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const clientName = document.getElementById('clientName').value;
            const passportNumber = document.getElementById('passportNumber').value;
            const issueDate = document.getElementById('issueDate').value;
            const durationDays = document.getElementById('durationDays').value;
            const expiryDate = document.getElementById('calcExpiry').innerText;
            const alertDate = document.getElementById('calcAlert').innerText;

            const res = await fetch('/api/visas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientName, passportNumber, issueDate, durationDays, expiryDate, alertDate })
            });

            if (res.ok) {
                document.getElementById('visaForm').reset();
                document.getElementById('calcExpiry').innerText = '---';
                document.getElementById('calcAlert').innerText = '---';
            }
        });

        // Delete Visa
        async function deleteVisa(id) {
            if (confirm('هل أنتِ متأكدة من حذف هذه التأشيرة؟')) {
                await fetch(`/api/visas/${id}`, { method: 'DELETE' });
            }
        }

        // Socket.io Realtime Listeners
        socket.on('visaAdded', (newVisa) => {
            visasData.unshift(newVisa);
            renderTable();
        });

        socket.on('visaDeleted', (id) => {
            visasData = visasData.filter(v => v._id !== id);
            renderTable();
        });

        // QR Code Generator Modal
        function showQRCode() {
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: window.location.href,
                width: 160,
                height: 160
            });
            document.getElementById('qrModal').style.display = 'flex';
        }

        // Initial Load
        fetchVisas();
    </script>
</body>
</html>
