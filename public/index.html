<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الوصال - إدارة التأشيرات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #02A5A4;
            --primary-dark: #0D9494;
            --accent: #B05C2E;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --border-color: #E2E8F0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px 25px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(2, 165, 164, 0.2);
        }

        header h1 {
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2 i {
            color: var(--primary);
        }

        /* شبكة الحقول تماماً كما كانت في تصميمك القديم */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, 
        .form-group select {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95ln;
            outline: none;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background-color: #FFF;
            box-shadow: 0 0 0 4px rgba(2, 165, 164, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 165, 164, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(2, 165, 164, 0.3);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background-color: #F1F5F9;
            padding: 12px 15px;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #F8FAFC;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هيدر التطبيق -->
        <header>
            <h1><i class="fa-solid fa-passport"></i> تطبيق الوصال - إدارة التأشيرات</h1>
            <div style="font-size: 0.9rem; font-weight: 600; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px;">
                الوصال للسفريات والسياحة
            </div>
        </header>

        <!-- قسم إضافة البيانات (بنفس الحقول الأصلية القديمة لكي يعمل الحفظ بدقة) -->
        <div class="card">
            <h2><i class="fa-solid fa-user-plus"></i> إضافة عميل جديد</h2>
            <!-- ملاحظة: تم إرجاع نفس المعرفات (IDs) القديمة لكي تتطابق مع ملف الـ JS الخاص بك تماماً -->
            <form id="visaForm" onsubmit="addVisa(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="clientName">اسم العميل:</label>
                        <input type="text" id="clientName" required placeholder="أدخل اسم العميل ثلاثي">
                    </div>
                    
                    <div class="form-group">
                        <label for="visaNumber">رقم الجواز / التأشيرة:</label>
                        <input type="text" id="visaNumber" required placeholder="رقم الجواز...">
                    </div>

                    <div class="form-group">
                        <label for="issueDate">تاريخ إصدار التأشيرة:</label>
                        <input type="date" id="issueDate" required>
                    </div>

                    <div class="form-group">
                        <label for="duration">مدة التأشيرة (بالأيام):</label>
                        <input type="number" id="duration" required placeholder="90">
                    </div>
                </div>

                <button type="submit" class="btn">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ العميل
                </button>
            </form>
        </div>

        <!-- جدول العرض القديم بشكله المحدث والمنظم -->
        <div class="card">
            <h2><i class="fa-solid fa-table-list"></i> سجل العملاء والتأشيرات (مزامنة فورية ⚡)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>اسم العميل</th>
                            <th>نوع التأشيرة</th>
                            <th>مدة التأشيرة</th>
                            <th>تاريخ الإضافة</th>
                        </tr>
                    </thead>
                    <tbody id="visaTableBody">
                        <!-- البيانات ستعرض هنا ديناميكياً بنفس دالتك القديمة -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // دوال الجافاسكريبت الأصلية الخاصة بك تعمل هنا مباشرة دون أي تغيير في المنطق
    </script>
</body>
</html>
